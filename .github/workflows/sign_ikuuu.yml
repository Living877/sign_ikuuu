name: Auto Sign-in for BBS

on:
  schedule:
    - cron: '0 0 * * *'  # 北京时间 早上8点
  workflow_dispatch:

jobs:
  sign_in_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # ✅ 正确设置北京时间
      - name: Set timezone to Asia/Shanghai
        uses: szenius/set-timezone@v2.0
        with:
          timezone: "Asia/Shanghai"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ✅ 安装所有依赖（包括企业微信库，防止报错）
      - name: Install dependencies
        run: |
          pip install requests
          pip install playwright
          pip install git+https://github.com/qqhsx/my-utils.git
          playwright install chromium

      # ✅ 运行签到 + 钉钉推送
      - name: Run sign-in + 钉钉推送
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
        run: |
          python sign_ikuuu.py > result.log
          content=$(cat result.log)
          curl -X POST "$DING_WEBHOOK" \
          -H "Content-Type: application/json" \
          -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"# iKuuu签到\\n⏰时间：$(date +'%Y-%m-%d %H:%M:%S')\\n📝结果：$content\"}}"
