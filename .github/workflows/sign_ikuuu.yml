name: Auto Sign-in
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 设定北京时间
        uses: szenius/set-timezone@v2.0
        with:
          timezone: Asia/Shanghai

      - name: 配置Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 安装依赖
        run: |
          pip install requests playwright
          playwright install chromium

      - name: 执行签到+钉钉推送
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
        run: |
          res=$(python sign_ikuuu.py)
          curl -s -X POST "${DING_WEBHOOK}" \
          -H "Content-Type:application/json" \
          -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"# IKUUU自动签到通知\n🕒执行时间：$(date +'%Y-%m-%d %H:%M:%S')\n📋签到结果：\n$res\"}}"
